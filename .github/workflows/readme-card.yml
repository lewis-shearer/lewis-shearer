name: Update README card

on:
  schedule:
    - cron: "0 */6 * * *"
  # Redraw straight away when stack, profile, or token data changes
  push:
    branches: [main]
    paths: [data/**, scripts/**, .github/**]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: readme-card
  cancel-in-progress: false

jobs:
  update-card:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate README card
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/generate_readme.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/readme.svg
          git diff --staged --quiet && exit 0
          git pull --rebase --autostash
          git commit -m "Update README card"
          # Point the README at this exact commit so GitHub's caches can never serve an old card
          SHA=$(git rev-parse HEAD)
          sed -i -E "s|lewis-shearer/lewis-shearer/[^/]+/assets/readme\.svg(\?t=[0-9]+)?|lewis-shearer/lewis-shearer/${SHA}/assets/readme.svg|" README.md
          git add README.md
          git commit -m "Point README at card ${SHA:0:7}"
          git push
